# CPCB National AQI breakpoints, used by models/exceedance.py to convert a
# forecast concentration (or exceedance probability) into an AQI category
# and a go/caution/no-go recommendation.
#
# VERIFICATION STATUS (checked 2026-09-20):
# Every PM2.5 and NO2 category boundary below (AQI ranges and concentration
# ranges, 24-hour averaging) matches the Indian AQI table published by
# aqihub.info/indices/india, and CPCB's own anchor points (PM2.5 sub-index 51
# at 31 ug/m3, 100 at 60 ug/m3) agree. That is a SECONDARY source: the
# official CPCB documents (cpcb.nic.in -> cpcb.gov.in) could not be fetched
# because cpcb.gov.in served an expired TLS certificate. Re-check against the
# official "About National Air Quality Index" PDF when it is reachable.
# The "severe" upper concentration bounds (380 for pm25, 600 for no2) are NOT
# from the table (which lists them open-ended, "250+" / "400+"); they are only
# a cap for interpolating a sub-index and do not affect the go/no-go category.
# The health_threshold_category ("poor": PM2.5 >= 91 ug/m3) uses verified rows.
# This file is deliberately kept out of code so a correction here never
# requires a code change or redeploy.
#
# Units: 24-hour average concentration in micrograms per cubic meter (ug/m3).
pollutants:
  pm25:
    unit: ug/m3
    averaging: 24h
    breakpoints:
      - category: good
        aqi_range: [0, 50]
        conc_range: [0, 30]
      - category: satisfactory
        aqi_range: [51, 100]
        conc_range: [31, 60]
      - category: moderate
        aqi_range: [101, 200]
        conc_range: [61, 90]
      - category: poor
        aqi_range: [201, 300]
        conc_range: [91, 120]
      - category: very_poor
        aqi_range: [301, 400]
        conc_range: [121, 250]
      - category: severe
        aqi_range: [401, 500]
        conc_range: [251, 380]
  no2:
    unit: ug/m3
    averaging: 24h
    breakpoints:
      - category: good
        aqi_range: [0, 50]
        conc_range: [0, 40]
      - category: satisfactory
        aqi_range: [51, 100]
        conc_range: [41, 80]
      - category: moderate
        aqi_range: [101, 200]
        conc_range: [81, 180]
      - category: poor
        aqi_range: [201, 300]
        conc_range: [181, 280]
      - category: very_poor
        aqi_range: [301, 400]
        conc_range: [281, 400]
      - category: severe
        aqi_range: [401, 500]
        conc_range: [401, 600]

# The AQI category at/above which schools should treat the day as
# "outdoor practice not recommended". Operators can raise/lower this per
# their own risk tolerance without any code change.
health_threshold_category: poor

# Decision threshold on the model's exceedance_probability (0-1) for setting
# forecasts.exceedance_flag = true. Recall is weighted over precision here
# (a missed bad-air day is worse than an extra false alarm) - see
# models/exceedance.py.
exceedance_probability_decision_threshold: 0.3
