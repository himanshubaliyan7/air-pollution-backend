# Regions the service covers. The API exposes these at GET /api/v1/regions so a
# frontend never has to hardcode a region name, time zone, or AQI standard.
#
# Adding a region here only makes the API DESCRIBE it. Actually forecasting it
# also needs backend work: a sensor source for its stations, a thresholds file
# for its AQI standard, a weather grid, and trained models.
#
# A station belongs to the first region whose bbox contains it.
regions:
  - id: delhi-ncr
    name: Delhi NCR
    country: IN
    timezone: Asia/Kolkata        # IANA name; used to bucket forecasts into local calendar days
    bbox: [76.6, 28.2, 77.6, 29.0]  # min_lon, min_lat, max_lon, max_lat
    aqi_standard: CPCB National AQI
    thresholds_config: thresholds_cpcb.yaml  # relative to this directory
  - id: mumbai
    name: Mumbai
    country: IN
    timezone: Asia/Kolkata
    # The Mumbai Metropolitan Region: Mumbai, Navi Mumbai, Thane, Kalyan-Dombivli, Vasai-Virar.
    # Holds all 43 stations CPCB's feed listed there on 2026-10-06, and stays clear of Pune.
    bbox: [72.70, 18.80, 73.35, 19.55]
    aqi_standard: CPCB National AQI
    thresholds_config: thresholds_cpcb.yaml
