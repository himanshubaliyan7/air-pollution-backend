# Model training config. Horizons/quantiles mirror config/settings.yaml's
# forecast section (the single source for what the product surfaces);
# hyperparams live here since they're a modeling concern, not a product one.
horizons_hours: [24, 48, 72, 96, 120]
quantiles: [0.1, 0.5, 0.9]

lightgbm:
  # num_threads is capped low deliberately: each individual model here is
  # small (at most a few thousand rows, ~20 features - one station's lag/
  # rolling/weather features for one pollutant/horizon), and LightGBM's
  # per-call threading overhead dominates at this scale - more threads
  # doesn't meaningfully speed up one fit. The real lever for training many
  # stations is process-level parallelism across independent station/
  # pollutant/horizon jobs (see scripts/train_all_parallel.py), which this
  # low per-model thread count leaves CPU headroom for.
  quantile:
    n_estimators: 200
    num_leaves: 31
    learning_rate: 0.05
    min_child_samples: 10
    num_threads: 2
  classifier:
    n_estimators: 200
    num_leaves: 31
    learning_rate: 0.05
    min_child_samples: 10
    is_unbalance: true
    num_threads: 2

training:
  # Trailing window pulled by retraining_dag; shorter default here so a
  # small amount of backfilled/seed data is still trainable in dev.
  default_training_window_days: 365
  holdout_days: 30
  min_training_rows: 100
  # Daily-mean level rule (models/level.py), fitted per region. A region's ratios
  # are registered only when its labelled rows span this many distinct local
  # days and come from this many stations; below that the stations of the region
  # get no forecast (no-data) rather than a thin or borrowed fit. Delhi NCR has a
  # year from ~80 stations; a new region needs about half a year first.
  min_level_days: 180
  min_level_stations: 3
  # Feature columns that are computed and stored but not given to the models.
  # The history holds one year, so day-of-year and the season flags identify
  # last year's dates instead of a season: a model learns "high from 1 October"
  # from the one October it saw. Measured with scripts/daily_verdict_backtest.py
  # (2026-10-03): with them the forecast bias was -65..-90 ug/m3 on the 2025
  # onset weeks and +31..+61 in late winter; without them -13..-40 and +6..+21.
  # Live, the forecasts tripled on 2026-10-01, the day is_stubble_season turned
  # true. Give them back once there are several years of history.
  excluded_features: [doy_sin, doy_cos, is_stubble_season, is_diwali_window]
