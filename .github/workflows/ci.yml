name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Same image as docker/docker-compose.yml: the integration tests need hypertables.
      postgres:
        image: timescale/timescaledb:2.14.2-pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Must name a "*_test" database: the integration tests TRUNCATE every table.
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/airpollution_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[ingestion,models,api,alerting,dev]" httpx

      - name: Create and migrate the test database
        run: python -m scripts.setup_test_db

      - name: Tests
        run: pytest -q
